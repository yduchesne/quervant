[package]
name = "quervant-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Standalone single-index search engine foundation for Quervant"
# Benchmarks are declared explicitly; keep auto-discovery from treating
# `benches/common/mod.rs` or helper files as independent targets.
autobenches = false

[[bench]]
name = "bm25"
path = "benches/bm25.rs"
harness = false

[[bench]]
name = "search"
path = "benches/search.rs"
harness = false

[[bench]]
name = "postings"
path = "benches/postings.rs"
harness = false

[[bench]]
name = "phrase"
path = "benches/phrase.rs"
harness = false

[[bench]]
name = "dictionary"
path = "benches/dictionary.rs"
harness = false

[[bench]]
name = "merge"
path = "benches/merge.rs"
harness = false

[[bench]]
name = "typed_analytics"
path = "benches/typed_analytics.rs"
harness = false

[[bench]]
name = "geo"
path = "benches/geo.rs"
harness = false

[dependencies]
quervant-objectstore = { version = "0.1.0", path = "../quervant-objectstore" }
# Unicode canonical normalization (NFC/NFD/NFKC/NFKD) for analyzer filters.
unicode-normalization = "0.1.25"
# Unicode word/grapheme segmentation (UAX #29) for the Unicode word tokenizer.
unicode-segmentation = "1.13.3"
# Full Unicode case folding (opt-in). Pinned: 2.3.0 requires Rust 1.88 > MSRV 1.85.
icu_casemap = "=2.0.1"
# Snowball English stemming (opt-in). Pinned to the reviewed 1.2.0 release.
rust-stemmers = "=1.2.0"
# UTS #46 IDNA (nontransitional) canonical domain identity.
idna = "1.1.0"
# Public Suffix List decomposition with a caller-supplied pinned list (no runtime fetch).
publicsuffix = "2.3.0"
# UTS #39 confusable skeleton as a separate derived representation.
unicode-security = "0.1.2"
# Parser-only regex grammar + AST (no regex execution in PR 4; execution is PR 8).
regex-syntax = "0.8"
# Runtime-only derived term FST for bounded multi-term intersection (PR 8).
# `Unlicense/MIT`; the library's built-in Levenshtein automaton is not used
# (PR 8 supplies its own exact Unicode-scalar / restricted-OSA automata).
fst = { version = "=0.4.7", default-features = false }
# Audited SHA-256 (RustCrypto) for canonical analyzer fingerprints. No custom crypto.
sha2 = "0.11"
# Adaptive exact `orient2d` (Shewchuk, GeoRust/Spade; MIT OR Apache-2.0) for exact
# polygon boundary classification without epsilon logic (PR 12). Verified to
# build on the workspace MSRV (Rust 1.85); no in-crate orientation predicate.
robust = "1.2.0"

[dev-dependencies]
# Single-thread executor for deterministic cache-synchronization tests.
futures = "0.3"
# Reused for golden-fixture digest assertions (already a normal dependency).
sha2 = "0.11"
# Statistical microbenchmark harness. Pinned to the newest release verified to
# build on the workspace MSRV (Rust 1.85); see docs/pr-artifacts/pr-7/amendment-04-preflight.md.
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }
# Independent whole-term regex oracle for PR 8 property tests (dev only).
regex = "1"
