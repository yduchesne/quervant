name: Rust CI
on:
  push:
    branches: [main, dev/bm09-real-qualification]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record tested source identity
        shell: bash
        env:
          BM09_EVENT_NAME: ${{ github.event_name }}
          BM09_EVENT_SHA: ${{ github.sha }}
          BM09_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          bm09_actual_commit="$(git rev-parse --verify HEAD)"
          bm09_actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          printf 'event=%s\nevent_sha=%s\npr_head_sha=%s\ncheckout_sha=%s\ncheckout_tree=%s\n' "$BM09_EVENT_NAME" "$BM09_EVENT_SHA" "$BM09_PR_HEAD_SHA" "$bm09_actual_commit" "$bm09_actual_tree"
          test "$bm09_actual_commit" = "$BM09_EVENT_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (default)
        run: cargo test --workspace --all-targets
      - name: Tests (all features)
        run: cargo test --workspace --all-targets --all-features
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Production Rust line coverage (minimum 85%)
        run: cargo llvm-cov --workspace --all-targets --all-features --fail-under-lines 85
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
      - name: Benchmark build
        run: cargo bench --workspace --no-run
      - name: Benchmark scripts
        run: bash benchmarks/scripts/test-scripts.sh
      - name: Whitespace check
        run: git diff --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record tested source identity
        shell: bash
        env:
          BM09_EVENT_NAME: ${{ github.event_name }}
          BM09_EVENT_SHA: ${{ github.sha }}
          BM09_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          bm09_actual_commit="$(git rev-parse --verify HEAD)"
          bm09_actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          printf 'event=%s\nevent_sha=%s\npr_head_sha=%s\ncheckout_sha=%s\ncheckout_tree=%s\n' "$BM09_EVENT_NAME" "$BM09_EVENT_SHA" "$BM09_PR_HEAD_SHA" "$bm09_actual_commit" "$bm09_actual_tree"
          test "$bm09_actual_commit" = "$BM09_EVENT_SHA"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +1.85.0 test --workspace --all-targets --all-features

  rustfs:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: quervanttest
          RUSTFS_SECRET_KEY: quervantsecret
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      QUERVANT_RUSTFS_ENDPOINT: http://127.0.0.1:9000
      QUERVANT_RUSTFS_REGION: us-east-1
      QUERVANT_RUSTFS_BUCKET: quervant-pr13-ci
      QUERVANT_RUSTFS_ACCESS_KEY: quervanttest
      QUERVANT_RUSTFS_SECRET_KEY: quervantsecret
    steps:
      - uses: actions/checkout@v4
      - name: Record tested source identity
        shell: bash
        env:
          BM09_EVENT_NAME: ${{ github.event_name }}
          BM09_EVENT_SHA: ${{ github.sha }}
          BM09_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          bm09_actual_commit="$(git rev-parse --verify HEAD)"
          bm09_actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          printf 'event=%s\nevent_sha=%s\npr_head_sha=%s\ncheckout_sha=%s\ncheckout_tree=%s\n' "$BM09_EVENT_NAME" "$BM09_EVENT_SHA" "$BM09_PR_HEAD_SHA" "$bm09_actual_commit" "$bm09_actual_tree"
          test "$bm09_actual_commit" = "$BM09_EVENT_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: S3 adapter acceptance (real RustFS)
        run: |
          cargo test -p quervant-objectstore --features s3 --test pr13_s3_rustfs -- --ignored --test-threads=1
          cargo test -p quervant-objectstore --features s3 --test pr13_proxy_rustfs -- --ignored --test-threads=1
      - name: Core remote acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test pr13_remote -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr13_oracle -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr13_oracle_geo -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr15g_a_rustfs -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr15g_b_rustfs -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr15g_c_rustfs -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr15g_d_rustfs -- --ignored --test-threads=1
      - name: M1 atomic batch acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test m1_batches -- --ignored --test-threads=1
      - name: PR 15I-A compact mutation-state acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test pr15i_a_rustfs -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr15i_b_rustfs -- --ignored --test-threads=1
      - name: M2 lossless patch acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test m2_patches -- --ignored --test-threads=1
      - name: M3 delete-by-query acceptance (real RustFS, three runs)
        run: |
          for i in $(seq 1 3); do
            cargo test -p quervant-core --all-features --test m3_delete_by_query -- --ignored --test-threads=1
          done
      - name: M5 mutation qualification (real RustFS, three independent runs)
        run: |
          for i in $(seq 1 3); do
            cargo test -p quervant-core --all-features --test m5_mutation_qualification -- --ignored --test-threads=1
          done
      - name: Deterministic fault proxy and crash acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test pr13_remote_proxy -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr13_crash_rustfs k0 -- --ignored --test-threads=1
      - name: Critical race/interrupt repetitions (10x)
        run: |
          for i in $(seq 1 10); do
            cargo test -p quervant-core --all-features --test pr13_crash_rustfs k05 -- --ignored --test-threads=1
          done

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The read-only legacy inventory is derived from the pinned baseline commit.
          fetch-depth: 0
      - name: Record tested source identity
        shell: bash
        env:
          BM09_EVENT_NAME: ${{ github.event_name }}
          BM09_EVENT_SHA: ${{ github.sha }}
          BM09_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          bm09_actual_commit="$(git rev-parse --verify HEAD)"
          bm09_actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          printf 'event=%s\nevent_sha=%s\npr_head_sha=%s\ncheckout_sha=%s\ncheckout_tree=%s\n' "$BM09_EVENT_NAME" "$BM09_EVENT_SHA" "$BM09_PR_HEAD_SHA" "$bm09_actual_commit" "$bm09_actual_tree"
          test "$bm09_actual_commit" = "$BM09_EVENT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract package (pinned direct dependencies)
        run: python -m pip install -e ./benchmarks
      - name: Compile contract package and inventory script
        run: python -m compileall -q benchmarks/quervant_bench benchmarks/scripts/bm-contract-inventory.py
      - name: L1 contract tests
        run: python -m unittest discover -s benchmarks/quervant_bench/tests -p 'test_*.py' -v
      - name: Read-only inspect (module entrypoint)
        run: PYTHONPATH=benchmarks python -m quervant_bench inspect --experiment synthetic-contract-smoke --format json
      - name: Read-only inspect (console entrypoint)
        run: quervant-bench inspect --experiment synthetic-contract-smoke --format json
      - name: Legacy inventory determinism check
        run: python benchmarks/scripts/bm-contract-inventory.py --baseline ea9bef647cf155bb0176f159a8b304319ed6f7de --check docs/pr-artifacts/bm-01/legacy-inventory.json
