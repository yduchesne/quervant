name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (default)
        run: cargo test --workspace --all-targets
      - name: Tests (all features)
        run: cargo test --workspace --all-targets --all-features
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Production Rust line coverage (minimum 85%)
        run: cargo llvm-cov --workspace --all-targets --all-features --fail-under-lines 85
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
      - name: Benchmark build
        run: cargo bench --workspace --no-run
      - name: Benchmark scripts
        run: bash benchmarks/scripts/test-scripts.sh
      - name: Whitespace check
        run: git diff --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +1.85.0 test --workspace --all-targets --all-features

  rustfs:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: quervanttest
          RUSTFS_SECRET_KEY: quervantsecret
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      QUERVANT_RUSTFS_ENDPOINT: http://127.0.0.1:9000
      QUERVANT_RUSTFS_REGION: us-east-1
      QUERVANT_RUSTFS_BUCKET: quervant-pr13-ci
      QUERVANT_RUSTFS_ACCESS_KEY: quervanttest
      QUERVANT_RUSTFS_SECRET_KEY: quervantsecret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: S3 adapter acceptance (real RustFS)
        run: |
          cargo test -p quervant-objectstore --features s3 --test pr13_s3_rustfs -- --ignored --test-threads=1
          cargo test -p quervant-objectstore --features s3 --test pr13_proxy_rustfs -- --ignored --test-threads=1
      - name: Core remote acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test pr13_remote -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr13_oracle -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr13_oracle_geo -- --ignored --test-threads=1
      - name: M1 atomic batch acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test m1_batches -- --ignored --test-threads=1
      - name: M2 lossless patch acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test m2_patches -- --ignored --test-threads=1
      - name: M3 delete-by-query acceptance (real RustFS, three runs)
        run: |
          for i in $(seq 1 3); do
            cargo test -p quervant-core --all-features --test m3_delete_by_query -- --ignored --test-threads=1
          done
      - name: M5 mutation qualification (real RustFS, three independent runs)
        run: |
          for i in $(seq 1 3); do
            cargo test -p quervant-core --all-features --test m5_mutation_qualification -- --ignored --test-threads=1
          done
      - name: Deterministic fault proxy and crash acceptance (real RustFS)
        run: |
          cargo test -p quervant-core --all-features --test pr13_remote_proxy -- --ignored --test-threads=1
          cargo test -p quervant-core --all-features --test pr13_crash_rustfs k0 -- --ignored --test-threads=1
      - name: Critical race/interrupt repetitions (10x)
        run: |
          for i in $(seq 1 10); do
            cargo test -p quervant-core --all-features --test pr13_crash_rustfs k05 -- --ignored --test-threads=1
          done

  # PR15D A1: isolated build + non-timed exact-hit smoke for all three adapters.
  # Never runs qualified performance trials, never uses --idle-confirmed, and
  # does not replace or weaken the rust/msrv/rustfs jobs above.
  pr15d-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper integrity before any Java invocation
        working-directory: benchmarks/pr15d/adapters/lucene
        run: |
          sha256sum -c A1-CHECKSUMS.sha256
          grep -q 'gradle-8.14.3-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531' gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Build Quervant and Tantivy standalone adapters
        run: |
          cargo build --release --locked --manifest-path benchmarks/pr15d/adapters/quervant/Cargo.toml --target-dir target/pr15d/build/quervant
          cargo build --release --locked --manifest-path benchmarks/pr15d/adapters/tantivy/Cargo.toml --target-dir target/pr15d/build/tantivy
      - name: Build Lucene adapter with verified Gradle 8.14.3 wrapper
        working-directory: benchmarks/pr15d/adapters/lucene
        env:
          PR15D_LUCENE_BUILD_DIR: ${{ github.workspace }}/target/pr15d/build/lucene
        run: ./gradlew --no-daemon classes installDist
      - name: Generate the frozen 10K/100K corpus
        run: python3 benchmarks/pr15d/corpus/generate.py --out target/pr15d/a1-ci-corpus
      - name: Three-adapter exact-hit correctness smoke (no timing)
        run: |
          python3 benchmarks/pr15d/harness/smoke.py \
            --corpus target/pr15d/a1-ci-corpus \
            --quervant-bin "${{ github.workspace }}/target/pr15d/build/quervant/release/pr15d-quervant-adapter" \
            --tantivy-bin "${{ github.workspace }}/target/pr15d/build/tantivy/release/pr15d-tantivy-adapter" \
            --lucene-command "${{ github.workspace }}/target/pr15d/build/lucene/install/pr15d-lucene-adapter/bin/pr15d-lucene-adapter"
