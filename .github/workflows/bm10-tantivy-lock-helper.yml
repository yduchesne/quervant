name: BM-10 temporary Tantivy dependency lockfile generation
on:
  pull_request:
    paths:
      - 'benchmarks/pr15d/adapters/tantivy/Cargo.toml'
      - '.github/workflows/bm10-tantivy-lock-helper.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Resolve exact independent Tantivy adapter lockfile (no benchmarks)
        shell: bash
        working-directory: benchmarks/pr15d/adapters/tantivy
        run: |
          set -euo pipefail
          cargo generate-lockfile
          test -s Cargo.lock
          printf 'BM10_LOCKFILE_BEGIN\n'
          cat Cargo.lock
          printf 'BM10_LOCKFILE_END\n'
