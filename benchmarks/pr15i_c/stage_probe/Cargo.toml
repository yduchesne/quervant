[package]
name = "pr15i-c-stage-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PR 15I-C benchmark-only stage probe (opt-in pr15ic-probe feature)"

# Standalone, independently locked benchmark project: never a member of the
# production workspace, and never allowed to change the production Cargo.lock.
[workspace]

[[bin]]
name = "pr15i-c-stage-probe"
path = "src/main.rs"

[dependencies]
quervant-core = { path = "../../../crates/quervant-core", features = ["pr15ic-probe"] }
