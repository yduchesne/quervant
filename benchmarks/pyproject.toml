[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quervant-bench"
version = "0.1.0"
description = "Direct, correctness-gated Quervant benchmark execution and analysis"
readme = { text = "Direct BM-10 benchmark framework; see benchmarks/BM10_README.md for use and testing.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Quervant contributors" }]
dependencies = []

[project.scripts]
quervant-bench = "quervant_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quervant_bench*"]

