[package]
name = "pr15i-a-remote-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PR 15I-A benchmark-only real-RustFS cold-bootstrap probe (public APIs only)"

# Standalone, independently locked benchmark project: never a member of the
# production workspace and never allowed to change the production Cargo.lock.
[workspace]

[[bin]]
name = "pr15i-a-remote-probe"
path = "src/main.rs"

[dependencies]
quervant-core = { path = "../../../crates/quervant-core", features = ["s3"] }
quervant-objectstore = { path = "../../../crates/quervant-objectstore", features = ["s3"] }
serde_json = "=1.0.145"
tokio = { version = "1.48.0", features = ["rt", "time", "macros"] }
