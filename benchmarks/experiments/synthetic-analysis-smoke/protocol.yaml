# Declarative measurement design for the deterministic BM-04 analysis fixture.
#
# This is NOT an authorised official protocol. It declares the frozen schedule,
# one synthetic A/A control campaign, two treatment campaigns, the symmetric
# within-arm spread exclusion ruleset and the frozen statistics identity the
# adjacent `analysis-profile.v1.json` must agree with. BM-03 simulates it; BM-04
# computes statistics and policy; BM-09 owns the first real campaign.
kind: protocol
schema_version: 1
protocol_id: synthetic-analysis-pair
protocol_version: 1
experiment_id: synthetic-analysis-smoke
workload_digest: sha256:2cc648557b95a10beeb26ca19b107ba839b3a1fc0bfd563bd7331abb8fa1fee9
arm_multiplicity:
  - arm_id: baseline
    slots_per_block: 1
  - arm_id: candidate
    slots_per_block: 1
schedule:
  schedule_id: synthetic-execution-balanced
  mode: seeded-balanced
  blocks: 4
  slots_per_block: 2
  seed: 42
measurement:
  warmups_per_lane_slot: 2
  samples_per_lane_slot: 3
  metric_unit: nanoseconds
  clock_contract_id: synthetic-logical-clock
campaigns:
  required_controls: 1
  required_treatments: 2
  control_contract_id: synthetic-exact-equality
host:
  capability_policy_id: synthetic-capability-policy
  readiness_policy_id: synthetic-readiness-policy
correctness:
  oracle_id: synthetic-contract-oracle
  oracle_version: 1
  must_pass_before_timing: true
exclusion:
  ruleset_id: within-arm-spread-v1
  symmetric_by_lane_and_block: true
  minimum_retained_blocks: 3
statistics:
  method_id: median-paired-ratios-v1
  resamples: 1000
  seed: 1592524801
  comparison_unit: paired-block
  interval_id: nearest-rank-percentile-v1
recovery:
  measurement_retries: 0
  ambiguous_outcome: hard-stop
policy:
  policy_id: synthetic-analysis-policy
  policy_version: 1
  policy_digest: sha256:d1e2c0b681ba90ea0f13e16acf9cd7bd5ff5f27b7445da04d4f72b034dab0e90
freeze:
  require_source_digest: true
  require_build_digest: true
  require_workload_digest: true
  before_first_official_control: true
provenance:
  notes: >-
    Simulated analysis declaration only. BM-04 computes the paired statistics,
    the symmetric exclusions and the frozen policy decision in memory; no Gate B
    receipt, attestation or real performance verdict is produced.
