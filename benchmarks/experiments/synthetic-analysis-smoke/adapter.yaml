# Declarative manifest for the BM-03 synthetic execution adapter.
#
# `kind: synthetic` is a literal marker: there is no real source or executable
# hash, no engine process, no clock and no measured Quervant invocation. The
# adapter replays declared simulated nanosecond values only.
kind: adapter
schema_version: 1
adapter_id: synthetic-execution
adapter_version: 1
engine_id: synthetic
operations:
  - search
cache_regimes:
  - warm
oracle_semantics_id: synthetic-contract-semantics
build_identity:
  kind: synthetic
measurement_envelope:
  unit: nanoseconds
  direction: lower-is-better
timeouts:
  setup_ms: 1000
  operation_ms: 1000
  cleanup_ms: 1000
provenance:
  notes: >-
    Synthetic execution adapter declaration only. The BM-03 controller refuses any
    other adapter manifest identity and never runs a real benchmark adapter.
