# PR 3 RustFS harness foundation (opt-in).
#
# This is NOT a production S3/RustFS adapter test. The production S3 adapter and
# mandatory real RustFS integration belong to PR 13. The harness exists so the
# topology, image pinning, credentials and cleanup are reproducible when PR 13
# wires the production adapter in.
#
# The image is pinned by tag and digest (verified against Docker Hub on
# 2026-10-12). Update the digest only as an explicit, reviewed change.
services:
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: quervant-rustfs
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # Disposable, test-only credentials; never reuse outside the harness.
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-quervant-test-access}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-quervant-test-secret}
      - RUSTFS_OBS_LOGGER_LEVEL=warn
    volumes:
      - rustfs-data:/data/rustfs0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: "no"
volumes:
  rustfs-data:
